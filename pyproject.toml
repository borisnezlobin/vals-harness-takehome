[project]
name = "negotiation-eval"
version = "0.1.0"
description = "Buyer vs. seller price negotiation eval between LLMs"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[project.scripts]
negotiate = "negotiation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["negotiation"]

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pyright]
include = ["negotiation", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
